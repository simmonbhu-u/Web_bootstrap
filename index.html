<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!--Menu-->
<div id="menu-container"></div>

<!-- Content here -->
    <div class="container">
        
        <h3 class="alert alert-info mt-4">หน้าหลัก</h3>
        <div class="alert alert-light text-center" role="alert">
            sugita Bhumisawasdi
        </div>

        <div>
            <a class="btn btn-success" href="https://www.google.com/">Google</a>
        </div>

    </div>
    <div class="container text-end mb-4">
        <div class="row">
            <div class="col-sm-4 bg-info text-center">
                <img src="shinchan1.jpg" width="100%" height="65%">
                shinchan1
            </div>
            <div class="col-sm-4 bg-warning text-center">
                <img src="shinchan2.jpg" width="100%">
                shinchan2
            </div>
            <div class="col-sm-4 bg-info">
                <h4 class="text-center mb-4">Register</h4>
                <form class="text-start">
                    <div class="mb-3">
                        <label class="form-label">Firstname</label>
                        <input type="text" class="form-control" id="firstname" required placeholder="input firstname">

                    </div>
                    <div class="mb-3">
                        <label class="form-label">Lastname</label>
                        <input type="text" class="form-control" id="lastname" required placeholder="input lastname">

                    </div>
                    <div class="mb-3">
                        <label class="form-label">Telephone</label>
                        <input type="tel" class="form-control" id="telephone" required placeholder="ex xxx-xxx-xxxx">

                    </div>
                    <div class="mb-3">
                        <label class="form-label">Province</label>
                        <select class="form-select" id="province" required>
                            <option value="" selected disabled>เลือกจังหวัด</option>
                            <option value="1">ชลบุรี</option>
                            <option value="2">ระยอง</option>
                            <option value="3">สมุทรปราการ</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email address</label>
                        <input type="email" class="form-control" id="e-mail" required placeholder="input email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="pw" required placeholder="input password">
                    </div>
                    <div class="text-center mb-4">
                        <button type="submit" class="btn btn-primary">Submit</button>
                        <button type="reset" class="btn btn-danger">Cancel</button>
                    </div>

                </form>
            </div>
        </div><!--end row-->
    </div>


<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/menu.js"></script>


</script>
</body>

</html>
